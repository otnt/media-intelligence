server:
  host: 127.0.0.1
  port: 8765
  # Required for phone ingest when the API is not on localhost. Send as X-Ingest-Token.
  ingest_token: ""

paths:
  videos: ~/AIContent/videos
  audio: ~/AIContent/audio
  artifacts: ~/AIContent/artifacts
  logs: ~/AIContent/logs
  vault: ""
  notes_folder: Transcripts

asr:
  default: qwen3-asr-1.7b
  # auto = detect language(s). Qwen3-ASR can keep mixed Chinese/English in one transcript.
  # Whisper still detects one language for the whole file.
  language: auto

download:
  # Moderate quality is enough for transcription.
  format: "bv*[height<=480]+ba/b[height<=480]/bv*[height<=720]+ba/b[height<=720]/b"
  # Chrome cookies help with Bilibili and occasional YouTube restrictions.
  cookies_from_browser: chrome

diarization:
  provider: pyannote
  model: pyannote/speaker-diarization-community-1
  hf_token: ""

worker:
  # Max tasks running at once per site. Downloads can overlap; ASR is capped separately.
  youtube: 10
  bilibili: 10
  other: 10
  # Local MLX/pyannote jobs. Keep this low on Apple Silicon.
  model_jobs: 1

analysis:
  # Local Qwen3.8-27B judges each keyframe after dedup. Install with: uv pip install -e '.[analysis]'
  enabled: true
  model: mlx-community/Qwen3.8-27B-4bit
  # Unload the ~16GB weights after this many idle seconds. 0 keeps the model resident.
  idle_unload_sec: 600
  max_tokens: 256

summary:
  # Pipeline default is qwen-3.8-27B 4bit thinking xhigh. Use qwen for thinking none.
  # Add gemini/openai to auto-compare every job. Dashboard can still pick 8bit Qwen or other models on one note.
  providers: [qwen-xhigh]
  qwen_8bit_model: mlx-community/Qwen3.8-27B-8bit
  gemini_model: gemini-2.5-flash
  openai_model: gpt-4.1-mini
  # Prefer env vars GEMINI_API_KEY / GOOGLE_API_KEY and OPENAI_API_KEY instead of putting keys here.
  gemini_api_key: ""
  openai_api_key: ""

visual:
  sample_interval_sec: 12
  scene_detector: auto
  scene_threshold: 27
  min_scene_duration_sec: 0.8
  similarity_threshold: 0.92
  visual_change_threshold: 0.18
  ocr_change_threshold: 0.45
  context_before_sec: 10
  context_after_sec: 20
  # Frames with VLM score below this are dropped from the note. Cached verdicts are reused.
  vlm_keep_threshold: 0.45
