server:
  host: 127.0.0.1
  port: 8875
  # Required for phone ingest when the API is not on localhost (LAN or Tailscale).
  # Send as X-Ingest-Token. Tailscale Serve is tailnet-only; never enable Funnel.
  ingest_token: ""

paths:
  videos: ~/AIContent/videos
  audio: ~/AIContent/audio
  artifacts: ~/AIContent/artifacts
  logs: ~/AIContent/logs
  vault: ""
  notes_folder: Transcripts

asr:
  # agy-gemini = Gemini via the agy CLI (your Google login): transcript + speaker tags, no API key.
  # fun-asr = Alibaba Cloud Fun-ASR: transcript + speaker tags in one cloud call (needs dashscope.api_key).
  default: qwen3-asr-1.7b
  # auto = detect language(s). Qwen3-ASR can keep mixed Chinese/English in one transcript.
  # Whisper still detects one language for the whole file.
  language: auto

download:
  # Moderate quality is enough for transcription.
  format: "bv*[height<=480]+ba/b[height<=480]/bv*[height<=720]+ba/b[height<=720]/b"
  # Chrome cookies help with Bilibili and occasional YouTube restrictions.
  cookies_from_browser: chrome

diarization:
  # Skipped automatically when the ASR model already tags speakers (agy-gemini, fun-asr).
  provider: pyannote
  model: pyannote/speaker-diarization-community-1
  hf_token: ""

worker:
  # Max tasks running at once per site. Downloads can overlap; ASR is capped separately.
  youtube: 10
  bilibili: 10
  other: 10
  # Max local ASR/diarization jobs. Keep this low on Apple Silicon.
  model_jobs: 1

dashboard:
  # Sidebar list defaults. Changing Filter / Grouping / Order in the dashboard writes them here.
  # filter: today | yesterday | 7d | all | YYYY-MM-DD
  filter: today
  # group: source | none | status | day
  group: source
  # order: requested_desc | requested_asc | updated_desc | title
  order: requested_desc

analysis:
  # Local Qwen3.8-27B judges each keyframe after dedup. Install with: uv pip install -e '.[analysis]'
  enabled: true
  # local = MLX on this Mac; dashscope = dashscope.vision_model in the cloud (no 16GB weights).
  provider: local
  model: mlx-community/Qwen3.8-27B-4bit
  # Unload the ~16GB weights after this many idle seconds. 0 keeps the model resident.
  idle_unload_sec: 600
  max_tokens: 256

summary:
  # Pipeline default is qwen-3.8-27B 4bit thinking xhigh. Use qwen for thinking none.
  # Add gemini/openai/deepseek-v4-pro/qwen3.8-max to auto-compare. Dashboard can still pick per note.
  providers: [qwen-xhigh]
  qwen_8bit_model: mlx-community/Qwen3.8-27B-8bit
  gemini_model: gemini-2.5-flash
  openai_model: gpt-4.1-mini
  deepseek_model: deepseek-v4-pro
  deepseek_base_url: https://api.deepseek.com
  qwen_max_model: qwen3.8-max
  # DashScope / Model Studio keys are region-specific. Match base_url to where the key was issued:
  # Mainland China: https://dashscope.aliyuncs.com/compatible-mode/v1
  # Singapore intl: https://dashscope-intl.aliyuncs.com/compatible-mode/v1
  # US (Virginia):  https://dashscope-us.aliyuncs.com/compatible-mode/v1
  # A key from one region on another region's host returns HTTP 401 invalid_api_key.
  qwen_max_base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  # Prefer env vars instead of putting keys here:
  # GEMINI_API_KEY / GOOGLE_API_KEY, OPENAI_API_KEY, DEEPSEEK_API_KEY, DASHSCOPE_API_KEY (or QWEN_API_KEY)
  gemini_api_key: ""
  openai_api_key: ""
  deepseek_api_key: ""
  qwen_api_key: ""
  # Dashboard Settings writes this. Empty uses the built-in analyst briefing prompt.
  prompt: ""

agy:
  # Antigravity CLI: Gemini through your Google login, no API key. Used by asr.default: agy-gemini.
  binary: agy
  # Argon keeps speakers consistent; 3.8 Flash splits one person into several labels.
  asr_model: gemini-4-argon-medium
  summary_model: gemini-4-argon-medium
  # Audio is sent in windows; neighbours overlap so speaker labels can be matched across them.
  window_sec: 180
  overlap_sec: 45
  concurrency: 3
  timeout_sec: 900

dashscope:
  # Alibaba Cloud Model Studio (百炼). One key for Fun-ASR, cloud keyframe judging and qwen3.8-max summaries.
  # Prefer DASHSCOPE_API_KEY in the environment. summary.qwen_api_key still works as a fallback.
  api_key: ""
  # Empty reuses summary.qwen_max_base_url's region. Keys are region-specific:
  # https://dashscope.aliyuncs.com (Beijing), https://dashscope-intl.aliyuncs.com (Singapore)
  base_url: ""
  asr_model: fun-asr
  # 0 = let Fun-ASR decide; 2-100 is a hint, not a guarantee.
  speaker_count: 0
  vision_model: qwen3.8-flash
  vision_concurrency: 4

visual:
  sample_interval_sec: 12
  scene_detector: auto
  scene_threshold: 27
  min_scene_duration_sec: 0.8
  similarity_threshold: 0.92
  visual_change_threshold: 0.18
  ocr_change_threshold: 0.45
  context_before_sec: 10
  context_after_sec: 20
  # Frames with VLM score below this are dropped from the note. Cached verdicts are reused.
  vlm_keep_threshold: 0.45
