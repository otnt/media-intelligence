<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Save & Transcribe</title>
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0;
        width: 300px;
        font: 13px/1.4 ui-sans-serif, system-ui, -apple-system, sans-serif;
        color: #0f172a;
        background: #fff;
      }
      header { padding: 12px 14px 4px; }
      h1 { margin: 0; font-size: 14px; }
      .ok { color: #15803d; }
      .err { color: #b91c1c; }
      .page { padding: 4px 14px 0; color: #334155; word-break: break-all; white-space: pre-wrap; }
      .status { padding: 8px 14px 10px; font-size: 13px; font-weight: 650; white-space: pre-wrap; min-height: 18px; }
      .retry {
        margin: 0 14px 10px; height: 30px; padding: 0 14px; border: 0; border-radius: 8px;
        background: #4f46e5; color: #fff; font-weight: 700; cursor: pointer;
      }
      .retry[hidden] { display: none; }
      .section {
        padding: 6px 14px 0; font-size: 11px; font-weight: 700; text-transform: uppercase;
        letter-spacing: 0.08em; color: #64748b;
      }
      ul { list-style: none; margin: 0; padding: 0 8px 12px; }
      li { padding: 8px; border-top: 1px solid #e2e8f0; }
      .title { font-weight: 650; }
      .meta { color: #64748b; font-size: 12px; }
    </style>
  </head>
  <body>
    <header><h1>✨ Media Intelligence</h1></header>
    <div class="page" id="page"></div>
    <div class="status" id="status">发送中…</div>
    <button class="retry" type="button" id="retry" hidden>重新发送</button>
    <div class="section">最近</div>
    <ul id="tasks"></ul>
    <script src="shared.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
