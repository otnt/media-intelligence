<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Save & Transcribe</title>
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0;
        width: 320px;
        font: 13px/1.4 ui-sans-serif, system-ui, -apple-system, sans-serif;
        color: #0f172a;
        background: #fff;
      }
      header { padding: 12px 14px 8px; }
      h1 { margin: 0; font-size: 14px; }
      .sub { color: #64748b; margin-top: 2px; }
      .ok { color: #15803d; }
      .err { color: #b91c1c; }
      ul { list-style: none; margin: 0; padding: 0 8px 12px; }
      li { padding: 8px; border-top: 1px solid #e2e8f0; }
      .title { font-weight: 650; }
      .meta { color: #64748b; font-size: 12px; }
    </style>
  </head>
  <body>
    <header>
      <h1>Save & Transcribe</h1>
      <div class="sub" id="health">Checking local service…</div>
    </header>
    <ul id="tasks"></ul>
    <script src="popup.js"></script>
  </body>
</html>
