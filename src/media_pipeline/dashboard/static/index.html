<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Media Pipeline</title>
  <style>
    :root {
      --bg: #0f1218;
      --panel: #171b24;
      --line: #2a3140;
      --text: #e8edf5;
      --muted: #8b95a8;
      --accent: #6d7cff;
      --keep: #3dd68c;
      --drop: #ff6b7a;
      --warn: #f0b429;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, sans-serif; }
    a { color: var(--accent); }
    button, select, input { font: inherit; }
    .app { display: grid; grid-template-columns: 340px 1fr; height: 100%; }
    .sidebar { border-right: 1px solid var(--line); display: flex; flex-direction: column; min-width: 0; }
    .brand { padding: 16px 18px 10px; }
    .brand h1 { margin: 0; font-size: 16px; letter-spacing: -0.02em; }
    .brand p { margin: 4px 0 0; color: var(--muted); font-size: 12px; }
    .list { overflow: auto; flex: 1; }
    .worker-panel { padding: 0 16px 14px; border-bottom: 1px solid var(--line); }
    .worker-panel h2 { margin: 0 0 8px; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
    .worker-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .worker-fields label.field input { width: 100%; }
    .worker-panel .actions { margin-top: 10px; align-items: center; }
    .worker-msg { font-size: 12px; color: var(--muted); }
    .occupancy { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .task { display: block; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); background: transparent; color: inherit; padding: 12px 16px; cursor: pointer; }
    .task:hover, .task.active { background: #1e2430; }
    .task .title { font-weight: 650; }
    .task .meta { color: var(--muted); font-size: 12px; margin-top: 3px; }
    .main { overflow: auto; padding: 20px 24px 48px; }
    .empty { color: var(--muted); padding: 40px 8px; }
    h2 { margin: 0 0 12px; font-size: 22px; }
    .row { display: flex; gap: 12px; flex-wrap: wrap; margin: 8px 0 18px; }
    .chip { background: #222836; border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; color: var(--muted); font-size: 12px; }
    .chip.ok { color: var(--keep); }
    .chip.bad { color: var(--drop); }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
    .card img { width: 100%; aspect-ratio: 16/9; object-fit: cover; background: #0b0d12; display: block; }
    .card .body { padding: 10px 12px 12px; font-size: 12px; color: var(--muted); }
    .card .body strong { color: var(--text); display: block; margin-bottom: 4px; }
    .actions { display: flex; gap: 8px; margin-top: 8px; }
    .btn { border: 0; border-radius: 8px; padding: 6px 10px; cursor: pointer; color: #fff; background: #2c3344; }
    .btn.keep { background: #1f6a45; }
    .btn.drop { background: #8a2d38; }
    .btn.primary { background: var(--accent); color: #0b0d12; font-weight: 700; }
    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin: 16px 0; }
    label.field { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
    label.field input, label.field select { background: #10141c; color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 7px 8px; }
    .fields { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
    .stages { display: grid; gap: 6px; font-size: 13px; }
    .stages div { display: flex; justify-content: space-between; border-bottom: 1px solid #222836; padding: 6px 0; }
    .kept { outline: 2px solid var(--keep); }
    .dropped { opacity: 0.55; }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <h1>Extraction dashboard</h1>
        <p id="health">Checking local backend…</p>
      </div>
      <div class="worker-panel">
        <h2>Concurrency</h2>
        <div class="worker-fields">
          <label class="field">YouTube max
            <input id="yt-limit" type="number" min="0" max="64" step="1" />
          </label>
          <label class="field">Bilibili max
            <input id="bili-limit" type="number" min="0" max="64" step="1" />
          </label>
          <label class="field">ASR / diarization
            <input id="model-limit" type="number" min="1" max="64" step="1" />
          </label>
        </div>
        <div class="occupancy" id="worker-occupancy"></div>
        <div class="actions">
          <button class="btn primary" id="save-worker">Save limits</button>
          <span class="worker-msg" id="worker-msg"></span>
        </div>
      </div>
      <div class="list" id="tasks"></div>
    </aside>
    <main class="main" id="main">
      <div class="empty">Select a task to inspect candidates, keyframes, and rerun stages.</div>
    </main>
  </div>
  <script>
    const main = document.getElementById("main");
    const tasksEl = document.getElementById("tasks");
    const healthEl = document.getElementById("health");
    const ytLimit = document.getElementById("yt-limit");
    const biliLimit = document.getElementById("bili-limit");
    const modelLimit = document.getElementById("model-limit");
    const occupancyEl = document.getElementById("worker-occupancy");
    const workerMsg = document.getElementById("worker-msg");
    const saveWorkerBtn = document.getElementById("save-worker");
    let tasks = [];
    let selectedId = new URLSearchParams(location.search).get("task");
    let debug = null;

    init();

    async function init() {
      await loadHealth();
      await loadWorker();
      await loadTasks();
      if (selectedId) await openTask(selectedId);
      setInterval(() => { loadTasks(); loadWorker(); }, 4000);
      saveWorkerBtn.onclick = saveWorker;
    }

    async function loadHealth() {
      try {
        const data = await api("/v1/health");
        healthEl.textContent = data.ok ? `Backend · dashboard ${data.dashboard || ""}` : "Backend not ready";
      } catch (error) {
        healthEl.textContent = error.message;
      }
    }

    async function loadWorker() {
      try {
        const data = await api("/v1/worker");
        renderWorker(data, { fillInputs: document.activeElement !== ytLimit && document.activeElement !== biliLimit && document.activeElement !== modelLimit });
      } catch (error) {
        occupancyEl.textContent = "";
        workerMsg.textContent = error.message;
      }
    }

    function renderWorker(data, { fillInputs = true } = {}) {
      const youtube = data.youtube || { limit: 10, running: 0 };
      const bilibili = data.bilibili || { limit: 10, running: 0 };
      const model = data.model_jobs || { limit: 1, running: 0 };
      if (fillInputs) {
        ytLimit.value = youtube.limit;
        biliLimit.value = bilibili.limit;
        modelLimit.value = model.limit;
      }
      occupancyEl.innerHTML = [
        chip("YouTube", youtube),
        chip("Bilibili", bilibili),
        chip("ASR", model),
      ].join("");
    }

    function chip(label, slot) {
      const running = Number(slot.running || 0);
      const limit = Number(slot.limit || 0);
      const busy = running > 0;
      return `<span class="chip ${busy ? "ok" : ""}">${esc(label)} ${running}/${limit}</span>`;
    }

    async function saveWorker() {
      workerMsg.textContent = "Saving…";
      try {
        const data = await api("/v1/worker", {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            youtube: Number(ytLimit.value),
            bilibili: Number(biliLimit.value),
            model_jobs: Number(modelLimit.value),
          }),
        });
        renderWorker(data.worker || data, { fillInputs: true });
        workerMsg.textContent = "Saved. Applies immediately.";
      } catch (error) {
        workerMsg.textContent = error.message;
      }
    }

    async function loadTasks() {
      const data = await api("/v1/tasks");
      tasks = data.tasks || [];
      tasksEl.innerHTML = tasks.map((task) => {
        const title = task.title || task.video_id || task.url;
        const counts = `${task.segment_count || 0} segs · ${task.candidate_count || 0} cand · ${task.keyframe_count || 0} keys`;
        return `<button class="task ${task.id === selectedId ? "active" : ""}" data-id="${task.id}">
          <div class="title">${esc(title)}</div>
          <div class="meta">${esc(task.status)} · ${esc(task.platform || "")} · ${esc(counts)}</div>
        </button>`;
      }).join("") || `<div class="empty">No tasks yet. Use the browser extension to extract a video.</div>`;
      tasksEl.querySelectorAll(".task").forEach((button) => {
        button.onclick = () => openTask(button.dataset.id);
      });
    }

    async function openTask(id) {
      selectedId = id;
      history.replaceState(null, "", `?task=${encodeURIComponent(id)}`);
      debug = await api(`/v1/tasks/${id}/debug`);
      renderDetail();
      await loadTasks();
    }

    function renderDetail() {
      const task = debug;
      const d = task.debug || {};
      const visual = task.visual || {};
      const stages = [
        ["Download", Boolean(task.video_path)],
        ["Audio", Boolean(task.audio_path)],
        ["ASR / transcript", d.transcript],
        ["Diarization", d.diarization],
        ["Transcript alignment", d.named],
        ["Scene detection", d.scenes],
        ["Candidate frames", d.candidates],
        ["Deduplicated keyframes", d.keyframes],
        ["Multimodal alignment", d.multimodal],
      ];
      const decisions = task.decisions || [];
      main.innerHTML = `
        <h2>${esc(task.title || task.video_id || "Untitled")}</h2>
        <div class="row">
          <span class="chip">${esc(task.status)}</span>
          <span class="chip">${esc(task.asr_label || task.asr_model)}</span>
          <span class="chip">${esc(task.platform)} ${esc(task.video_id)}</span>
          <span class="chip">${task.segment_count || 0} transcript segments</span>
          <span class="chip">${task.candidate_count || 0} candidates</span>
          <span class="chip">${task.keyframe_count || 0} keyframes</span>
        </div>
        <p class="empty" style="padding:0 0 12px">${esc(task.url || "")}${task.error ? " · " + esc(task.error) : ""}</p>
        <div class="panel">
          <div class="stages">
            ${stages.map(([name, ok]) => `<div><span>${name}</span><span class="chip ${ok ? "ok" : ""}">${ok ? "yes" : "—"}</span></div>`).join("")}
          </div>
        </div>
        <div class="panel">
          <strong>Rerun a stage</strong>
          <div class="fields" style="margin-top:10px">
            <label class="field">Stage
              <select id="stage">
                <option value="deduplicating_frames">Re-run deduplication</option>
                <option value="sampling_frames">Re-run candidate generation</option>
                <option value="detecting_scenes">Re-run scene detection</option>
                <option value="aligning_multimodal">Rebuild multimodal alignment</option>
                <option value="transcribing">Re-run ASR</option>
                <option value="diarizing">Re-run diarization</option>
                <option value="all">Full rerun</option>
              </select>
            </label>
            <label class="field">Sample interval (s)
              <input id="sample_interval_sec" type="number" value="${visual.sample_interval_sec ?? 12}" />
            </label>
            <label class="field">Scene threshold
              <input id="scene_threshold" type="number" value="${visual.scene_threshold ?? 27}" />
            </label>
            <label class="field">Similarity threshold
              <input id="similarity_threshold" type="number" step="0.01" value="${visual.similarity_threshold ?? 0.92}" />
            </label>
            <label class="field">Min scene (s)
              <input id="min_scene_duration_sec" type="number" step="0.1" value="${visual.min_scene_duration_sec ?? 0.8}" />
            </label>
            <label class="field">Context before (s)
              <input id="context_before_sec" type="number" value="${visual.context_before_sec ?? 10}" />
            </label>
            <label class="field">Context after (s)
              <input id="context_after_sec" type="number" value="${visual.context_after_sec ?? 20}" />
            </label>
          </div>
          <div class="actions">
            <button class="btn primary" id="rerun">Queue rerun</button>
          </div>
        </div>
        <h3>Candidate frames</h3>
        <div class="grid" id="gallery"></div>
      `;
      document.getElementById("rerun").onclick = rerun;
      const gallery = document.getElementById("gallery");
      gallery.innerHTML = decisions.map((item) => cardHtml(task.video_id, item)).join("") || `<div class="empty">No candidate frames yet.</div>`;
      gallery.querySelectorAll("[data-act]").forEach((button) => {
        button.onclick = () => decide(button.dataset.file, button.dataset.act);
      });
    }

    function cardHtml(videoId, item) {
      const name = (item.path || "").split("/").pop();
      const kept = Boolean(item.dedup && item.dedup.kept);
      const src = `/v1/videos/${encodeURIComponent(videoId)}/frames/candidate_frames/${encodeURIComponent(name)}`;
      const sources = (item.sources || []).join(" + ") || "unknown";
      const sim = item.dedup ? Number(item.dedup.similarity || 0).toFixed(2) : "—";
      const nearest = item.dedup?.nearest_frame || "—";
      const decision = item.dedup?.decision || "auto";
      return `<article class="card ${kept ? "kept" : "dropped"}">
        <img src="${src}" alt="${esc(name)}" />
        <div class="body">
          <strong>${fmt(item.timestamp)} · ${kept ? "KEEP" : "DROP"}</strong>
          Source: ${esc(sources)}<br />
          Nearest: ${esc(nearest)} · similarity ${esc(sim)} · ${esc(decision)}
          <div class="actions">
            <button class="btn keep" data-act="keep" data-file="${esc(name)}">Keep</button>
            <button class="btn drop" data-act="drop" data-file="${esc(name)}">Drop</button>
          </div>
        </div>
      </article>`;
    }

    async function decide(filename, decision) {
      await api(`/v1/videos/${encodeURIComponent(debug.video_id)}/frames/${encodeURIComponent(filename)}/decision`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ decision }),
      });
      await api(`/v1/tasks/${debug.id}/retry`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ stage: "deduplicating_frames" }),
      });
      await openTask(debug.id);
    }

    async function rerun() {
      const visual = {};
      for (const key of ["sample_interval_sec", "scene_threshold", "similarity_threshold", "min_scene_duration_sec", "context_before_sec", "context_after_sec"]) {
        const node = document.getElementById(key);
        if (node && node.value !== "") visual[key] = Number(node.value);
      }
      await api(`/v1/tasks/${debug.id}/retry`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ stage: document.getElementById("stage").value, visual }),
      });
      await openTask(debug.id);
    }

    async function api(path, options) {
      const response = await fetch(path, options);
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.detail || data.error || response.statusText);
      return data;
    }

    function esc(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function fmt(seconds) {
      const total = Math.max(0, Math.floor(Number(seconds) || 0));
      const h = String(Math.floor(total / 3600)).padStart(2, "0");
      const m = String(Math.floor((total % 3600) / 60)).padStart(2, "0");
      const s = String(total % 60).padStart(2, "0");
      return `${h}:${m}:${s}`;
    }
  </script>
</body>
</html>
