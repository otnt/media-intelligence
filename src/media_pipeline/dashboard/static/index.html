<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Media Pipeline</title>
  <style>
    :root {
      --bg: #0f1218;
      --panel: #171b24;
      --line: #2a3140;
      --text: #e8edf5;
      --muted: #8b95a8;
      --accent: #6d7cff;
      --keep: #3dd68c;
      --drop: #ff6b7a;
      --warn: #f0b429;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, sans-serif; }
    a { color: var(--accent); }
    button, select, input { font: inherit; }
    .app { display: grid; grid-template-columns: 340px 1fr; height: 100%; }
    .sidebar { border-right: 1px solid var(--line); display: flex; flex-direction: column; min-width: 0; }
    .brand { padding: 16px 18px 10px; }
    .brand h1 { margin: 0; font-size: 16px; letter-spacing: -0.02em; }
    .brand p { margin: 4px 0 0; color: var(--muted); font-size: 12px; }
    .list { overflow: auto; flex: 1; }
    .worker-panel { padding: 0 16px 14px; border-bottom: 1px solid var(--line); }
    .worker-panel h2 { margin: 0 0 8px; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
    .worker-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .worker-fields label.field input { width: 100%; }
    .worker-panel .actions { margin-top: 10px; align-items: center; }
    .worker-msg { font-size: 12px; color: var(--muted); }
    .occupancy { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .task { display: block; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); background: transparent; color: inherit; padding: 12px 16px; cursor: pointer; }
    .task:hover, .task.active { background: #1e2430; }
    .task .title { font-weight: 650; }
    .task .meta { color: var(--muted); font-size: 12px; margin-top: 3px; }
    .main { overflow: auto; padding: 20px 24px 48px; }
    .empty { color: var(--muted); padding: 40px 8px; }
    h2 { margin: 0 0 12px; font-size: 22px; }
    .row { display: flex; gap: 12px; flex-wrap: wrap; margin: 8px 0 18px; }
    .chip { background: #222836; border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; color: var(--muted); font-size: 12px; }
    .chip.ok { color: var(--keep); }
    .chip.bad { color: var(--drop); }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
    .card img { width: 100%; aspect-ratio: 16/9; object-fit: cover; background: #0b0d12; display: block; }
    .card .body { padding: 10px 12px 12px; font-size: 12px; color: var(--muted); }
    .card .body strong { color: var(--text); display: block; margin-bottom: 4px; }
    .actions { display: flex; gap: 8px; margin-top: 8px; }
    .btn { border: 0; border-radius: 8px; padding: 6px 10px; cursor: pointer; color: #fff; background: #2c3344; }
    .btn.keep { background: #1f6a45; }
    .btn.drop { background: #8a2d38; }
    .btn.primary { background: var(--accent); color: #0b0d12; font-weight: 700; }
    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin: 16px 0; }
    label.field { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); position: relative; overflow: visible; }
    label.field input, label.field select { background: #10141c; color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 7px 8px; }
    .fields { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; overflow: visible; }
    .label-row { display: flex; align-items: center; gap: 6px; }
    .help {
      flex: 0 0 auto;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 1px solid var(--line);
      background: #222836;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      line-height: 16px;
      padding: 0;
      cursor: help;
    }
    .help .tip {
      display: none;
      position: absolute;
      z-index: 40;
      left: 0;
      top: calc(100% + 8px);
      width: 280px;
      max-width: min(280px, 70vw);
      background: #0b0d12;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 12px;
      color: var(--text);
      font-size: 12px;
      font-weight: 400;
      line-height: 1.45;
      white-space: pre-wrap;
      box-shadow: 0 10px 28px rgba(0,0,0,0.45);
      text-align: left;
    }
    .field:hover .help .tip,
    .help:hover .tip,
    .help:focus .tip,
    .help:focus-visible .tip { display: block; }
    .panel { overflow: visible; }
    .stages { display: grid; gap: 0; font-size: 13px; }
    .stage-head, .stage-row {
      display: grid;
      grid-template-columns: minmax(7.5rem, 1.5fr) 10rem 6.5rem 4.6rem;
      gap: 8px;
      align-items: center;
      border-bottom: 1px solid #222836;
      padding: 6px 0;
    }
    .stage-head { color: var(--muted); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; }
    .stage-row .chip { justify-self: end; }
    .time { font-variant-numeric: tabular-nums; color: var(--muted); }
    .kept { outline: 2px solid var(--keep); }
    .dropped { opacity: 0.55; }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <h1>Extraction dashboard</h1>
        <p id="health">Checking local backend…</p>
      </div>
      <div class="worker-panel">
        <h2>Concurrency</h2>
        <div class="worker-fields">
          <label class="field">YouTube max
            <input id="yt-limit" type="number" min="0" max="64" step="1" />
          </label>
          <label class="field">Bilibili max
            <input id="bili-limit" type="number" min="0" max="64" step="1" />
          </label>
          <label class="field">ASR / diarization
            <input id="model-limit" type="number" min="1" max="64" step="1" />
          </label>
        </div>
        <div class="occupancy" id="worker-occupancy"></div>
        <div class="actions">
          <button class="btn primary" id="save-worker">Save limits</button>
          <span class="worker-msg" id="worker-msg"></span>
        </div>
      </div>
      <div class="list" id="tasks"></div>
    </aside>
    <main class="main" id="main">
      <div class="empty">Select a task to inspect candidates, keyframes, and rerun stages.</div>
    </main>
  </div>
  <script>
    const main = document.getElementById("main");
    const tasksEl = document.getElementById("tasks");
    const healthEl = document.getElementById("health");
    const ytLimit = document.getElementById("yt-limit");
    const biliLimit = document.getElementById("bili-limit");
    const modelLimit = document.getElementById("model-limit");
    const occupancyEl = document.getElementById("worker-occupancy");
    const workerMsg = document.getElementById("worker-msg");
    const saveWorkerBtn = document.getElementById("save-worker");
    let tasks = [];
    let selectedId = new URLSearchParams(location.search).get("task");
    let debug = null;

    init();

    async function init() {
      await loadHealth();
      await loadWorker();
      await loadTasks();
      if (selectedId) await openTask(selectedId);
      setInterval(() => { loadTasks(); loadWorker(); refreshSelected(); }, 4000);
      saveWorkerBtn.onclick = saveWorker;
    }

    async function loadHealth() {
      try {
        const data = await api("/v1/health");
        healthEl.textContent = data.ok ? `Backend · dashboard ${data.dashboard || ""}` : "Backend not ready";
      } catch (error) {
        healthEl.textContent = error.message;
      }
    }

    async function loadWorker() {
      try {
        const data = await api("/v1/worker");
        renderWorker(data, { fillInputs: document.activeElement !== ytLimit && document.activeElement !== biliLimit && document.activeElement !== modelLimit });
      } catch (error) {
        occupancyEl.textContent = "";
        workerMsg.textContent = error.message;
      }
    }

    function renderWorker(data, { fillInputs = true } = {}) {
      const youtube = data.youtube || { limit: 10, running: 0 };
      const bilibili = data.bilibili || { limit: 10, running: 0 };
      const model = data.model_jobs || { limit: 1, running: 0 };
      if (fillInputs) {
        ytLimit.value = youtube.limit;
        biliLimit.value = bilibili.limit;
        modelLimit.value = model.limit;
      }
      occupancyEl.innerHTML = [
        chip("YouTube", youtube),
        chip("Bilibili", bilibili),
        chip("ASR", model),
      ].join("");
    }

    function chip(label, slot) {
      const running = Number(slot.running || 0);
      const limit = Number(slot.limit || 0);
      const busy = running > 0;
      return `<span class="chip ${busy ? "ok" : ""}">${esc(label)} ${running}/${limit}</span>`;
    }

    async function saveWorker() {
      workerMsg.textContent = "Saving…";
      try {
        const data = await api("/v1/worker", {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            youtube: Number(ytLimit.value),
            bilibili: Number(biliLimit.value),
            model_jobs: Number(modelLimit.value),
          }),
        });
        renderWorker(data.worker || data, { fillInputs: true });
        workerMsg.textContent = "Saved. Applies immediately.";
      } catch (error) {
        workerMsg.textContent = error.message;
      }
    }

    async function loadTasks() {
      const data = await api("/v1/tasks");
      tasks = data.tasks || [];
      tasksEl.innerHTML = tasks.map((task) => {
        const title = task.title || task.video_id || task.url;
        const counts = `${task.segment_count || 0} segs · ${task.candidate_count || 0} cand · ${task.keyframe_count || 0} keys`;
        return `<button class="task ${task.id === selectedId ? "active" : ""}" data-id="${task.id}">
          <div class="title">${esc(title)}</div>
          <div class="meta">${esc(task.status)} · ${esc(task.platform || "")} · ${esc(counts)}</div>
        </button>`;
      }).join("") || `<div class="empty">No tasks yet. Use the browser extension to extract a video.</div>`;
      tasksEl.querySelectorAll(".task").forEach((button) => {
        button.onclick = () => openTask(button.dataset.id);
      });
    }

    async function openTask(id) {
      selectedId = id;
      history.replaceState(null, "", `?task=${encodeURIComponent(id)}`);
      debug = await api(`/v1/tasks/${id}/debug`);
      renderDetail();
      await loadTasks();
    }

    const KNOB_HELP = {
      stage: "Which pipeline step to restart from. Artifacts produced by that step and everything after it are discarded, then the job is queued again.\n\nRe-run Qwen3.8 frame filter: keep existing keyframe JPEGs and re-score which ones belong in the note. Changing the VLM keep threshold reuses cached verdicts and does not reload the model.\n\nRe-run deduplication: keep existing candidate JPEGs and recompute keep/drop with the similarity threshold and your manual Keep/Drop overrides.\n\nRe-run candidate generation: recut stills from scene boundaries, the sample interval, and visual-change spikes, then dedup again.\n\nRe-run scene detection: detect cuts again with the scene threshold and min scene length, then regenerate candidates and keyframes.\n\nRebuild multimodal alignment: keep keyframes; rebuild transcript context windows in multimodal.json. The Obsidian note puts each frame above the transcript block covering that timestamp.\n\nRe-run ASR: transcribe audio again, then redo diarization and transcript alignment. Video and WAV files are reused. Visual stills are kept unless a later visual stage is also selected.\n\nRe-run diarization: refresh speaker labels and realign the transcript. Frames stay; the multimodal timeline is rebuilt.\n\nFull rerun: redo ASR through note writing. Download and audio extraction run only if those files are missing.",
      sample_interval_sec: "How often to grab a still even when the picture is not changing, in seconds. Default 12.\n\nSmaller values catch more slides, title cards, and UI states, and produce more candidate JPEGs. Periodic samples are merged with scene cuts and visual-change spikes when they land within 0.4 seconds of each other.\n\nUsed when you rerun candidate generation or an earlier visual stage.",
      scene_threshold: "How sensitive scene-cut detection is. Default 27, in PySceneDetect ContentDetector units (about 0.30 as an ffmpeg scene score).\n\nLower values create more cuts and therefore more candidate frames. Higher values ignore small motion, zooms, and talking-head jitter.\n\nCuts shorter than Min scene are merged into the previous scene. Used when you rerun scene detection or a full visual rerun.",
      similarity_threshold: "When two candidate frames are similar enough to drop the later one as a duplicate. Default 0.92.\n\nEach candidate is compared to kept frames in the previous 30 seconds using dHash plus color histogram. It is auto-dropped only if similarity is at least this value. Lower means more aggressive dropping of talking-head frames; higher keeps more near-duplicates.\n\nManual Keep/Drop always wins. A large OCR text change can force-keep a frame that would otherwise drop.\n\nUsed when you rerun deduplication.",
      min_scene_duration_sec: "Shortest scene that is kept as its own span, in seconds. Default 0.8.\n\nShorter detected cuts are merged into the previous scene so a fade, blink, or flash does not emit a burst of extra frames.\n\nUsed when you rerun scene detection.",
      context_before_sec: "How many seconds of transcript to attach before each keyframe in multimodal.json. Default 10.\n\nThis window is stored for later analysis. It does not move images in the Obsidian note. The note places each frame above the speech block whose time range covers that frame.\n\nUsed when you rebuild multimodal alignment.",
      context_after_sec: "How many seconds of transcript to attach after each keyframe in multimodal.json. Default 20, because speakers often put a slide up and then talk about it.\n\nTogether with Context before, this is the machine-readable window on each keyframe. It does not change where frames appear in the note.\n\nUsed when you rebuild multimodal alignment.",
      vlm_keep_threshold: "Minimum Qwen3.8 score (0-1) for a keyframe to appear in the Obsidian note. Default 0.45.\n\nThe model scores how much unique visual information the frame adds beyond the transcript. Talking-heads, transitions, and blur typically score low; slides, book covers, UI, and diagrams score high.\n\nRe-running the Qwen3.8 frame filter with a new threshold reuses cached verdicts. It does not call the model again unless a frame has no verdict yet. Manual Keep/Drop still wins.",
    };

    const STAGE_ROWS = [
      ["fetching_metadata", "Fetch metadata", "metadata"],
      ["downloading", "Download", "video"],
      ["extracting_audio", "Audio", "audio"],
      ["transcribing", "ASR / transcript", "transcript"],
      ["diarizing", "Diarization", "diarization"],
      ["aligning_transcript", "Transcript alignment", "named"],
      ["detecting_scenes", "Scene detection", "scenes"],
      ["sampling_frames", "Candidate frames", "candidates"],
      ["deduplicating_frames", "Deduplicated keyframes", "keyframes"],
      ["filtering_frames", "Qwen3.8 frame filter", "frame_analysis"],
      ["aligning_multimodal", "Multimodal alignment", "multimodal"],
      ["writing_outputs", "Writing outputs", "outputs"],
    ];

    async function refreshSelected() {
      if (!selectedId || !document.getElementById("stages")) return;
      try {
        debug = await api(`/v1/tasks/${selectedId}/debug`);
      } catch (_error) {
        return;
      }
      const stagesEl = document.getElementById("stages");
      if (stagesEl) stagesEl.innerHTML = stagesInner(debug);
      const statusChip = document.getElementById("task-status");
      if (statusChip) statusChip.textContent = debug.status || "";
      const errorLine = document.getElementById("task-error");
      if (errorLine) {
        errorLine.textContent = `${debug.url || ""}${debug.error ? " · " + debug.error : ""}`;
      }
      if (!rerunPanelBusy()) {
        const gallery = document.getElementById("gallery");
        const decisions = debug.decisions || [];
        if (gallery) {
          gallery.innerHTML = decisions.map((item) => cardHtml(debug.video_id, item)).join("") || `<div class="empty">No candidate frames yet.</div>`;
          gallery.querySelectorAll("[data-act]").forEach((button) => {
            button.onclick = () => decide(button.dataset.file, button.dataset.act, button.dataset.stage);
          });
        }
      }
    }

    function rerunPanelBusy() {
      const panel = document.getElementById("rerun-panel");
      if (!panel) return false;
      if (panel.contains(document.activeElement)) return true;
      return Boolean(panel.querySelector(".help:hover, .field:hover"));
    }

    function renderDetail() {
      const task = debug;
      const visual = task.visual || {};
      main.innerHTML = `
        <h2>${esc(task.title || task.video_id || "Untitled")}</h2>
        <div class="row">
          <span class="chip" id="task-status">${esc(task.status)}</span>
          <span class="chip">${esc(task.asr_label || task.asr_model)}</span>
          <span class="chip">${esc(task.platform)} ${esc(task.video_id)}</span>
          <span class="chip">${task.segment_count || 0} transcript segments</span>
          <span class="chip">${task.candidate_count || 0} candidates</span>
          <span class="chip">${task.keyframe_count || 0} keyframes</span>
          <span class="chip">${task.selected_count || (task.debug && task.debug.selected_count) || 0} kept by Qwen</span>
        </div>
        <p class="empty" id="task-error" style="padding:0 0 12px">${esc(task.url || "")}${task.error ? " · " + esc(task.error) : ""}</p>
        <div class="panel">
          <div class="stages" id="stages">${stagesInner(task)}</div>
        </div>
        <div class="panel" id="rerun-panel">
          <strong>Rerun a stage</strong>
          <div class="fields" style="margin-top:10px">
            ${knobField("stage", "Stage", `<select id="stage">
                <option value="filtering_frames">Re-run Qwen3.8 frame filter</option>
                <option value="deduplicating_frames">Re-run deduplication</option>
                <option value="sampling_frames">Re-run candidate generation</option>
                <option value="detecting_scenes">Re-run scene detection</option>
                <option value="aligning_multimodal">Rebuild multimodal alignment</option>
                <option value="transcribing">Re-run ASR</option>
                <option value="diarizing">Re-run diarization</option>
                <option value="all">Full rerun</option>
              </select>`)}
            ${knobField("sample_interval_sec", "Sample interval (s)", `<input id="sample_interval_sec" type="number" value="${esc(visual.sample_interval_sec ?? 12)}" />`)}
            ${knobField("scene_threshold", "Scene threshold", `<input id="scene_threshold" type="number" value="${esc(visual.scene_threshold ?? 27)}" />`)}
            ${knobField("similarity_threshold", "Similarity threshold", `<input id="similarity_threshold" type="number" step="0.01" value="${esc(visual.similarity_threshold ?? 0.92)}" />`)}
            ${knobField("min_scene_duration_sec", "Min scene (s)", `<input id="min_scene_duration_sec" type="number" step="0.1" value="${esc(visual.min_scene_duration_sec ?? 0.8)}" />`)}
            ${knobField("context_before_sec", "Context before (s)", `<input id="context_before_sec" type="number" value="${esc(visual.context_before_sec ?? 10)}" />`)}
            ${knobField("context_after_sec", "Context after (s)", `<input id="context_after_sec" type="number" value="${esc(visual.context_after_sec ?? 20)}" />`)}
            ${knobField("vlm_keep_threshold", "VLM keep threshold", `<input id="vlm_keep_threshold" type="number" step="0.05" min="0" max="1" value="${esc(visual.vlm_keep_threshold ?? 0.45)}" />`)}
          </div>
          <div class="actions">
            <button class="btn primary" id="rerun">Queue rerun</button>
          </div>
        </div>
        <h3>Candidate frames</h3>
        <div class="grid" id="gallery"></div>
      `;
      document.getElementById("rerun").onclick = rerun;
      const gallery = document.getElementById("gallery");
      const decisions = task.decisions || [];
      gallery.innerHTML = decisions.map((item) => cardHtml(task.video_id, item)).join("") || `<div class="empty">No candidate frames yet.</div>`;
      gallery.querySelectorAll("[data-act]").forEach((button) => {
        button.onclick = () => decide(button.dataset.file, button.dataset.act, button.dataset.stage);
      });
    }

    function knobField(key, label, controlHtml) {
      return `<label class="field">
        <span class="label-row">${esc(label)}<button type="button" class="help" aria-label="About ${esc(label)}">?<span class="tip">${esc(KNOB_HELP[key] || "")}</span></button></span>
        ${controlHtml}
      </label>`;
    }

    function stagesInner(task) {
      const d = task.debug || {};
      const timings = task.stage_timings || {};
      const artifactOk = {
        metadata: Boolean(d.metadata),
        video: Boolean(task.video_path),
        audio: Boolean(task.audio_path),
        transcript: Boolean(d.transcript),
        diarization: Boolean(d.diarization),
        named: Boolean(d.named),
        scenes: Boolean(d.scenes),
        candidates: Boolean(d.candidates),
        keyframes: Boolean(d.keyframes),
        frame_analysis: Boolean(d.frame_analysis),
        multimodal: Boolean(d.multimodal),
        outputs: task.status === "completed",
      };
      const rows = STAGE_ROWS.map(([key, label, flag]) => {
        const timing = timings[key] || {};
        const state = stageChip(timing, artifactOk[flag]);
        return `<div class="stage-row">
          <span>${esc(label)}</span>
          <span class="time">${esc(fmtStart(timing.started_at))}</span>
          <span class="time">${esc(fmtStageDuration(timing))}</span>
          <span class="chip ${state.cls}">${esc(state.label)}</span>
        </div>`;
      }).join("");
      return `<div class="stage-head"><span>Stage</span><span>Started</span><span>Duration</span><span>Done</span></div>${rows}`;
    }

    function stageChip(timing, ok) {
      const status = timing.status || "";
      if (status === "running") return { label: "running", cls: "" };
      if (status === "failed") return { label: "failed", cls: "bad" };
      if (status === "succeeded" || ok) return { label: "yes", cls: "ok" };
      return { label: "—", cls: "" };
    }

    function fmtStart(iso) {
      if (!iso) return "—";
      const date = new Date(iso);
      if (Number.isNaN(date.getTime())) return String(iso);
      const time = date.toLocaleTimeString([], { hour12: false, hour: "2-digit", minute: "2-digit", second: "2-digit" });
      const now = new Date();
      if (date.toDateString() === now.toDateString()) return time;
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      return `${date.getFullYear()}-${month}-${day} ${time}`;
    }

    function fmtStageDuration(timing) {
      if (!timing || timing.status !== "succeeded" || timing.duration_sec == null || timing.duration_sec === "") return "—";
      const seconds = Number(timing.duration_sec);
      if (!Number.isFinite(seconds) || seconds < 0) return "—";
      if (seconds < 10) return `${seconds.toFixed(1)}s`;
      if (seconds < 60) return `${Math.round(seconds)}s`;
      const total = Math.round(seconds);
      const hours = Math.floor(total / 3600);
      const minutes = Math.floor((total % 3600) / 60);
      const secs = total % 60;
      if (hours) return `${hours}h ${minutes}m ${secs}s`;
      return `${minutes}m ${secs}s`;
    }

    function cardHtml(videoId, item) {
      const name = (item.path || "").split("/").pop();
      const vlm = item.analysis;
      const dedupKept = Boolean(item.dedup && item.dedup.kept);
      const kept = vlm ? Boolean(vlm.kept) : dedupKept;
      const src = `/v1/videos/${encodeURIComponent(videoId)}/frames/candidate_frames/${encodeURIComponent(name)}`;
      const sources = (item.sources || []).join(" + ") || "unknown";
      const sim = item.dedup ? Number(item.dedup.similarity || 0).toFixed(2) : "—";
      const nearest = item.dedup?.nearest_frame || "—";
      const decision = vlm ? (vlm.decision || "vlm") : (item.dedup?.decision || "auto");
      const score = vlm && vlm.score != null ? Number(vlm.score).toFixed(2) : "";
      const category = vlm && vlm.category ? vlm.category : "";
      const caption = vlm && vlm.caption ? vlm.caption : "";
      const reason = vlm && vlm.reason ? vlm.reason : "";
      const retryStage = vlm && dedupKept ? "filtering_frames" : "deduplicating_frames";
      const vlmLine = vlm
        ? `Qwen: ${esc(category || "—")} · score ${esc(score || "—")}${reason ? "<br />" + esc(reason) : ""}${caption ? "<br />" + esc(caption) : ""}<br />`
        : "";
      return `<article class="card ${kept ? "kept" : "dropped"}">
        <img src="${src}" alt="${esc(name)}" />
        <div class="body">
          <strong>${fmt(item.timestamp)} · ${kept ? "KEEP" : "DROP"}</strong>
          Source: ${esc(sources)}<br />
          Nearest: ${esc(nearest)} · similarity ${esc(sim)} · ${esc(decision)}<br />
          ${vlmLine}
          <div class="actions">
            <button class="btn keep" data-act="keep" data-file="${esc(name)}" data-stage="${retryStage}">Keep</button>
            <button class="btn drop" data-act="drop" data-file="${esc(name)}" data-stage="${retryStage}">Drop</button>
          </div>
        </div>
      </article>`;
    }

    async function decide(filename, decision, stage) {
      await api(`/v1/videos/${encodeURIComponent(debug.video_id)}/frames/${encodeURIComponent(filename)}/decision`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ decision }),
      });
      await api(`/v1/tasks/${debug.id}/retry`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ stage: stage || "deduplicating_frames" }),
      });
      await openTask(debug.id);
    }

    async function rerun() {
      const visual = {};
      for (const key of ["sample_interval_sec", "scene_threshold", "similarity_threshold", "min_scene_duration_sec", "context_before_sec", "context_after_sec", "vlm_keep_threshold"]) {
        const node = document.getElementById(key);
        if (node && node.value !== "") visual[key] = Number(node.value);
      }
      await api(`/v1/tasks/${debug.id}/retry`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ stage: document.getElementById("stage").value, visual }),
      });
      await openTask(debug.id);
    }

    async function api(path, options) {
      const response = await fetch(path, options);
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.detail || data.error || response.statusText);
      return data;
    }

    function esc(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function fmt(seconds) {
      const total = Math.max(0, Math.floor(Number(seconds) || 0));
      const h = String(Math.floor(total / 3600)).padStart(2, "0");
      const m = String(Math.floor((total % 3600) / 60)).padStart(2, "0");
      const s = String(total % 60).padStart(2, "0");
      return `${h}:${m}:${s}`;
    }
  </script>
</body>
